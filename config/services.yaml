# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    kafka_gateway_url: '%env(KAFKA_GATEWAY_URL)%'
    kafka_mail_send_path_api: 'kafka/mail-send'
    dictionary_service_url: '%env(DICTIONARY_SERVICE_URL)%'
    app.timezone: '%env(APP_TIMEZONE)%'
    db_schema: '%env(DB_SCHEMA)%'
    app.name: '%env(APP_NAME)%'
    app.version: '%env(APP_VERSION)%'
    jwt.public_key: '%env(file:JWT_PUBLIC_KEY_FILE)%'
    jwt.audience_access_token: '%env(JWT_AUDIENCE_ACCESS_TOKEN)%'
    jwt.issuer: '%env(JWT_CATALOG_ISSUER)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true
        autoconfigure: true

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Регистрируем обработчик ошибок
    App\EventSubscriber\:
        resource: '../src/EventSubscriber'
        tags: [ 'kernel.event_subscriber' ]

    # ------------------- QuickSignup -------------------
    App\Infrastructure\Registration\SignupRequestStorage:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Infrastructure\Registration\SignupRedisStorage:
        arguments:
            $redis: '@redis'

    App\Shared\Utils\VerificationCodeGenerator: ~

    App\Application\Registration\QuickSignup\QuickSignupValidator:
        arguments:
            $dictionaryDomainService: '@App\Domain\Dictionaries\DictionaryDomainService'

    App\Domain\Dictionaries\DictionaryDomainService:
        arguments:
            $dictionaryProvider: '@App\Infrastructure\Dictionary\HttpDictionaryProvider'

    App\Application\Registration\QuickSignup\QuickSignupHandler:
        arguments:
            $validator: '@App\Application\Registration\QuickSignup\QuickSignupValidator'
            $registrationAttemptValidator: '@App\Application\Registration\QuickSignup\RegistrationAttemptValidator'
            $signupService: '@App\Application\Registration\QuickSignup\SignupRequestService'
            $redis: '@App\Infrastructure\Registration\Otp\Redis\RedisOtpStorage'

    App\Application\Registration\VerificationPHONE\SendPhoneVerificationCodeHandler:
        arguments:
            $smsPublisher: '@App\Infrastructure\EventPublisher\HttpSmsEventPublisher'

    redis:
        class: Predis\Client
        factory: ['App\Infrastructure\Registration\RedisFactory', 'create']
        arguments:
            - '%env(REDIS_URL)%'
            - '%env(default::REDIS_PASSWORD)%'
            - '%env(default::REDIS_SSL_CA)%'

    # ------------------- Verification -------------------

    App\Infrastructure\Registration\VerificationCodeStorage:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Infrastructure\Registration\VerificationCodeRedisStorage:
        arguments:
            $redis: '@redis'

    App\Domain\Registration\Otp\OtpStorageInterface:
        alias: App\Infrastructure\Registration\Otp\Redis\RedisOtpStorage

    App\Application\Registration\Verification\VerificationCodeService:
        autowire: true
        autoconfigure: true

    App\Infrastructure\Registration\Otp\Redis\RedisOtpStorage:
        arguments:
            $redis: '@redis'

    App\Infrastructure\RateLimit\RedisRateLimiter:
        arguments:
            $redis: '@redis'

    App\Infrastructure\EventPublisher\HttpEmailEventPublisher:
        arguments:
            $baseUrl: '%kafka_gateway_url%'
            $mailSendPath: '%kafka_mail_send_path_api%'

    App\Infrastructure\EventPublisher\HttpSmsEventPublisher:
        arguments:
            $baseUrl: '%kafka_gateway_url%'
            $smsSendPath: '%kafka_mail_send_path_api%'

    App\Infrastructure\EventPublisher\HttpKafkaEventPublisher:
        arguments:
            $baseUrl: '%kafka_gateway_url%'
            $publishPath: '%kafka_mail_send_path_api%'

    App\Infrastructure\Dictionary\HttpDictionaryProvider:
        arguments:
            $baseUrl: '%dictionary_service_url%'

    # ------------------- Service name & Version ------------
    App\Infrastructure\Application\ApplicationInfo:
        arguments:
            $name: '%app.name%'
            $version: '%app.version%'

    # ------------------- Time checker class ----------------
    App\Shared\Time\ClockInterface:
        alias: App\Shared\Time\SystemClock

    App\Shared\Time\SystemClock:
        arguments:
            $timezone: '%app.timezone%'

    # ------------------- DB schema class -------------------
    App\Infrastructure\DB\SchemaSqlHelper:
        arguments:
            $schema: '%db_schema%'

    App\Infrastructure\Security\JwtTokenDecoder:
        arguments:
            $publicKey: '%jwt.public_key%'
            $issuer: '%jwt.issuer%'
            $audience: '%jwt.audience_access_token%'

    # ------------------- Company Registration ---------------

    # HTTP event publisher (→ Java gateway → Kafka)
    App\Infrastructure\EventPublisher\HttpEventPublisher:
        arguments:
            $baseUrl: '%kafka_gateway_url%'
            $mailSendPath: '%kafka_mail_send_path_api%'

    App\Application\Shared\EventPublisherInterface:
        alias: App\Infrastructure\EventPublisher\HttpEventPublisher

    App\Application\Registration\Serializer\CompanyRegistrationSerializer: ~

    App\Infrastructure\Persistence\DbalCompanyRepository:
        arguments:
            $schema: '%db_schema%'

    App\Infrastructure\Persistence\DbalAddressRepository:
        arguments:
            $schema: '%db_schema%'

    App\Infrastructure\Persistence\DbalLeaderRepository:
        arguments:
            $schema: '%db_schema%'

    App\Infrastructure\Persistence\DbalContactRepository:
        arguments:
            $schema: '%db_schema%'

    App\Infrastructure\Persistence\DbalBankDetailRepository:
        arguments:
            $schema: '%db_schema%'

    App\Infrastructure\Persistence\Registration\DbalCompanyRegistrationProgressRepository:
        arguments:
            $schema: '%db_schema%'

    App\EventSubscriber\Registration\CompanyRegistrationSubscriber:
        tags: ['kernel.event_subscriber']
